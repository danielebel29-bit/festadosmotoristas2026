<script>
    // URL do Apps Script
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyuvA9V-65xnb7pth7-YcHolv9RTHmFSEu_JPzHASgzqWN1mM_oKzyV-jmuRSvShjLVwQ/exec'.trim();

    let dailyChart = null;

    function fetchSheetData() {
        const statusEl = document.getElementById('sync-status');
        statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30";
        statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Atualizando...';

        if (!WEB_APP_URL || !WEB_APP_URL.startsWith('https://script.google.com')) {
            alert('Atenção: Insira uma URL válida do Apps Script na variável WEB_APP_URL.');
            statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30";
            statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span> URL Pendente';
            return;
        }

        fetch(WEB_APP_URL)
            .then(response => {
                if (!response.ok) throw new Error('Erro ao conectar com a planilha');
                return response.json();
            })
            .then(data => {
                initDashboard(data);
                statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Sincronizado';
            })
            .catch(error => {
                console.error("Erro:", error);
                statusEl.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30";
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span> Erro de conexão';
            });
    }

    // ... Mantenha o restante das funções initDashboard e filterTable iguais ...
</script>
